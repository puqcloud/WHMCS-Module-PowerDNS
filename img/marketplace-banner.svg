<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a4e4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00a4e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0082c9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Enlarged DNS Globe icon group -->
  <g transform="translate(170, 45) scale(2.0)">
    <!-- Globe outer circle -->
    <circle cx="40" cy="40" r="34" fill="#00a4e4" opacity="0.1" stroke="#00a4e4" stroke-width="2.5"/>
    <!-- Latitudes -->
    <ellipse cx="40" cy="40" rx="34" ry="13" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <line x1="6" y1="40" x2="74" y2="40" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <!-- Longitudes -->
    <ellipse cx="40" cy="40" rx="13" ry="34" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <!-- Nodes -->
    <circle cx="40" cy="6" r="3.5" fill="#7dd3fc"/>
    <circle cx="40" cy="74" r="3.5" fill="#7dd3fc"/>
    <circle cx="6" cy="40" r="3.5" fill="#7dd3fc"/>
    <circle cx="74" cy="40" r="3.5" fill="#7dd3fc"/>
    <circle cx="40" cy="40" r="4.5" fill="#0082c9"/>
  </g>

  <!-- Module Name -->
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">POWERDNS</text>
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">MODULE</text>

  <!-- Subtitle -->
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WHMCS SERVER MODULE</text>

  <!-- Separator -->
  <rect x="150" y="405" width="200" height="4" fill="#0082c9" rx="2"/>

  <!-- PUQ Software Branding -->
  <g transform="translate(150, 435)">
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0082c9">PUQ</text>
    <text x="92" y="28" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Software</text>
  </g>
</svg>
