<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a4e4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="250" fill="url(#bg)" rx="8"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="440" height="4" fill="url(#accent)" rx="2"/>

  <!-- Globe / DNS network icon -->
  <g transform="translate(40, 60)">
    <!-- Globe -->
    <circle cx="40" cy="40" r="34" fill="none" stroke="#00a4e4" stroke-width="2.5"/>
    <!-- Latitudes -->
    <ellipse cx="40" cy="40" rx="34" ry="13" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <line x1="6" y1="40" x2="74" y2="40" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <!-- Longitudes -->
    <ellipse cx="40" cy="40" rx="13" ry="34" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
    <!-- Nodes -->
    <circle cx="40" cy="6" r="3" fill="#7dd3fc"/>
    <circle cx="40" cy="74" r="3" fill="#7dd3fc"/>
    <circle cx="6" cy="40" r="3" fill="#7dd3fc"/>
    <circle cx="74" cy="40" r="3" fill="#7dd3fc"/>
    <circle cx="40" cy="40" r="3" fill="#0082c9"/>
  </g>

  <!-- WHMCS badge -->
  <g transform="translate(140, 68)">
    <rect x="0" y="0" width="85" height="32" rx="6" fill="#00a4e4" opacity="0.15" stroke="#00a4e4" stroke-width="1.5"/>
    <text x="42" y="21" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle">WHMCS</text>
  </g>

  <!-- Module title -->
  <text x="240" y="90" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="start">PowerDNS</text>

  <!-- Subtitle -->
  <text x="240" y="118" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">WHMCS Server Module</text>

  <!-- Divider -->
  <rect x="240" y="131" width="60" height="2" fill="#0082c9" rx="1"/>

  <!-- Description -->
  <text x="240" y="155" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Sell DNS zone management as a</text>
  <text x="240" y="171" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">product, backed by PowerDNS</text>

  <!-- PUQ Software branding -->
  <g transform="translate(30, 210)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0082c9">PUQ</text>
    <text x="55" y="15" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Software</text>
  </g>
</svg>
