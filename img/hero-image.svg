<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161c33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:1" />
    </linearGradient>
    <!-- Accent Top Line Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00a4e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00a4e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0082c9;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Ambient Glow -->
  <circle cx="180" cy="150" r="120" fill="#0082c9" opacity="0.16" />
  <circle cx="180" cy="150" r="80" fill="#00a4e4" opacity="0.18" />

  <!-- LEFT: Illustration (Centered around X=180, Y=150) -->
  <g transform="translate(180, 150) scale(1.6)">
    <g transform="translate(-40, -40)">
      <!-- Globe outer circle -->
      <circle cx="40" cy="40" r="34" fill="#00a4e4" opacity="0.1" stroke="#00a4e4" stroke-width="2.5"/>
      <!-- Latitudes -->
      <ellipse cx="40" cy="40" rx="34" ry="13" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
      <line x1="6" y1="40" x2="74" y2="40" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
      <!-- Longitudes -->
      <ellipse cx="40" cy="40" rx="13" ry="34" fill="none" stroke="#00a4e4" stroke-width="1.5" opacity="0.7"/>
      <!-- Nodes -->
      <circle cx="40" cy="6" r="3.5" fill="#7dd3fc"/>
      <circle cx="40" cy="74" r="3.5" fill="#7dd3fc"/>
      <circle cx="6" cy="40" r="3.5" fill="#7dd3fc"/>
      <circle cx="74" cy="40" r="3.5" fill="#7dd3fc"/>
      <circle cx="40" cy="40" r="4.5" fill="#0082c9"/>
    </g>
  </g>

  <!-- CENTER: Text Content -->
  <g transform="translate(360, 45)">
    <!-- Subtitle Category -->
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#00a4e4" letter-spacing="3">WHMCS SERVER MODULE</text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">PUQ POWERDNS</text>

    <!-- Divider Line -->
    <rect x="0" y="102" width="500" height="3" fill="url(#accent)" rx="1.5"/>

    <!-- Key Bullet Points -->
    <g transform="translate(0, 130)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="6" r="4" fill="#00a4e4"/>
      <text x="20" y="10" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="500">
        Automated DNS zone &amp; PTR management via PowerDNS HTTP API
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="34" r="4" fill="#00a4e4"/>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="500">
        Full record control (A, AAAA, CNAME, MX, TXT, SRV, CAA, SOA)
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="62" r="4" fill="#00a4e4"/>
      <text x="20" y="66" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="500">
        Client self-service zone editor, TTL presets &amp; instant synchronization
      </text>
    </g>
  </g>

  <!-- RIGHT: Branding & Badge -->
  <!-- Divider -->
  <line x1="930" y1="40" x2="930" y2="260" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <g transform="translate(970, 75)">
    <!-- PUQ Software Branding -->
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#0082c9">PUQ</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#94a3b8" letter-spacing="2">SOFTWARE</text>

    <!-- Verified Badge -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="165" height="38" rx="6" fill="#1e293b" stroke="#0082c9" stroke-width="1.5"/>
      <!-- Checkmark Circle -->
      <circle cx="22" cy="19" r="10" fill="#22c55e"/>
      <polyline points="17,19 20,22 27,15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="17" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc">MARKETPLACE</text>
      <text x="38" y="29" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">VERIFIED MODULE</text>
    </g>
  </g>
</svg>
